[package]
name = "git-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "HTTP and WebSocket API for repository metrics"
license = "BSD-3-Clause"
authors = ["Nicholas Bisset"]
repository = "https://github.com/Densetsu152637/Git-Metrics-Haskell"
readme = "README.md"

[lib]
name = "git_api"
path = "src/lib.rs"

[[bin]]
name = "git-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
